  <!-- ================= CATEGORIES ================= -->
  <section id="menu" class="screen" aria-label="Menu">
    <header class="bar">
      <a href="#/" class="icon-btn lg-btn" aria-label="Home"><span class="lg-glass"></span><span class="lg-shadow"></span><span class="lg-content" data-ico="home"></span></a>
      <div class="bar-title"><span class="mini-brand">QUU</span><span class="mini-sub">COFFEE</span></div>
      <div class="lang-switch lg-surface compact" role="group"></div>
    </header>
    <div class="search-wrap">
      <label class="search">
        <span data-ico="search"></span>
        <input type="search" id="searchMenu" autocomplete="off" data-i18n-ph="searchPh" />
        <button class="search-clear" type="button" data-ico="x" aria-label="Clear" hidden></button>
      </label>
    </div>
    <main class="scroll" id="menuScroll">
      <h2 class="section-h" data-i18n="categories"></h2>
      <div class="cat-grid" id="catGrid"></div>
      <div class="results" id="menuResults" hidden></div>
      <p class="foot-note" data-i18n="disclaimer"></p>
    </main>
  </section>

  <!-- ================= CATEGORY ================= -->
  <section id="category" class="screen" aria-label="Category">
    <header class="bar">
      <a href="#/menu" class="icon-btn lg-btn" aria-label="Back"><span class="lg-glass"></span><span class="lg-shadow"></span><span class="lg-content" data-ico="back"></span></a>
      <div class="bar-title"><span class="mini-brand">QUU</span><span class="mini-sub">COFFEE</span></div>
      <div class="lang-switch lg-surface compact" role="group"></div>
    </header>
    <div class="search-wrap">
      <label class="search">
        <span data-ico="search"></span>
        <input type="search" id="searchCat" autocomplete="off" data-i18n-ph="searchPh" />
        <button class="search-clear" type="button" data-ico="x" aria-label="Clear" hidden></button>
      </label>
    </div>
    <nav class="chips" id="chips" aria-label="Categories"></nav>
    <main class="scroll" id="catScroll">
      <div id="catBody"></div>
      <div class="results" id="catResults" hidden></div>
      <div class="legend" id="legend"></div>
      <p class="foot-note" data-i18n="disclaimer"></p>
    </main>
  </section>

  <!-- ================= BOTTOM SHEET ================= -->
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <button class="icon-btn lg-btn sheet-close" id="sheetClose" aria-label="Close"><span class="lg-glass"></span><span class="lg-shadow"></span><span class="lg-content" data-ico="x"></span></button>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <!-- Liquid Glass SVG filtresi (LiquidButton > GlassFilter) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="container-glass" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.05 0.05" numOctaves="1" seed="1" result="turbulence" />
        <feGaussianBlur in="turbulence" stdDeviation="2" result="blurredNoise" />
        <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="70" xChannelSelector="R" yChannelSelector="B" result="displaced" />
        <feGaussianBlur in="displaced" stdDeviation="4" result="finalBlur" />
        <feComposite in="finalBlur" in2="finalBlur" operator="over" />
      </filter>
    </defs>
  </svg>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
