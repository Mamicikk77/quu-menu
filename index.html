<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" id="themeColor" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="QUU Coffee dijital menü — Türkçe, English, Русский" />
  <title>QUU Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">

  <!-- ================= KARŞILAMA ================= -->
  <section id="splash" class="screen active" aria-label="QUU Coffee">
    <video id="bgVideo" class="splash-video" src="video/0926.mp4" autoplay muted loop playsinline preload="auto"></video>
    <div class="splash-scrim"></div>

    <header class="splash-top">
      <button id="soundBtn" class="glass glass-circle" type="button" aria-label="Ses" aria-pressed="false"><span id="soundIco" data-ico="volx"></span></button>
      <div class="seg seg-glass glass" data-seg></div>
    </header>

    <div class="splash-body">
      <h1 class="brand-name intro" style="--d:80">QUU</h1>
      <p class="brand-sub intro" style="--d:200">COFFEE</p>
      <p class="tagline intro" style="--d:320" data-i18n="tagline"></p>
      <a href="#/menu" class="btn-primary intro" style="--d:440"><span data-i18n="viewMenu"></span><span data-ico="chev"></span></a>
      <nav class="actions intro" style="--d:540" aria-label="Links">
        <a class="action glass" id="qWa" target="_blank" rel="noopener"><span data-ico="wa"></span><span class="action-l" data-i18n="whatsapp"></span></a>
        <a class="action glass" id="qGo" target="_blank" rel="noopener"><span data-ico="star"></span><span class="action-l" data-i18n="review"></span></a>
        <a class="action glass" id="qIg" target="_blank" rel="noopener"><span data-ico="ig"></span><span class="action-l">Instagram</span></a>
        <button class="action glass" id="qWifi" type="button"><span data-ico="wifi"></span><span class="action-l">Wi-Fi</span></button>
      </nav>
      <p class="vat intro" style="--d:640" data-i18n="vat"></p>
    </div>
  </section>

  <!-- ================= MENÜ ================= -->
  <section id="menu" class="screen" aria-label="Menu">
    <header class="nav">
      <a href="#/" class="nav-back"><span data-ico="chevL"></span><span data-i18n="home"></span></a>
      <span class="nav-title" data-i18n="menuTitle"></span>
      <div class="seg seg-compact" data-seg></div>
    </header>
    <main class="scroll" id="menuScroll">
      <h1 class="large-title" data-i18n="menuTitle"></h1>
      <label class="search">
        <span data-ico="search"></span>
        <input type="search" id="search" autocomplete="off" enterkeyhint="search" data-i18n-ph="searchPh" />
        <button class="search-clear" id="searchClear" type="button" data-ico="x" aria-label="Clear" hidden></button>
      </label>
      <div id="menuNormal">
        <h2 class="group-h" data-i18n="featured"></h2>
        <div class="featured" id="featured"></div>
        <h2 class="group-h" data-i18n="categories"></h2>
        <div class="list" id="catList"></div>
      </div>
      <div id="menuResults" hidden></div>
      <p class="foot-note" data-i18n="disclaimer"></p>
    </main>
  </section>

  <!-- ================= KATEGORİ ================= -->
  <section id="category" class="screen" aria-label="Category">
    <header class="nav">
      <a href="#/menu" class="nav-back"><span data-ico="chevL"></span><span data-i18n="menuTitle"></span></a>
      <span class="nav-title" id="catNavTitle"></span>
      <div class="seg seg-compact" data-seg></div>
    </header>
    <main class="scroll" id="catScroll">
      <h1 class="large-title" id="catTitle"></h1>
      <p class="large-sub" id="catSub" hidden></p>
      <nav class="chips" id="chips" aria-label="Categories"></nav>
      <div id="catBody"></div>
      <p class="foot-note" data-i18n="disclaimer"></p>
    </main>
  </section>

</div>

<!-- ================= ALT PANEL ================= -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grabber"></div>
  <button class="sheet-close" id="sheetClose" type="button" data-ico="x" aria-label="Kapat"></button>
  <div id="sheetBody"></div>
</div>

<div class="hud" id="hud" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
