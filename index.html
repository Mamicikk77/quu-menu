<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B2E4A" />
  <meta name="description" content="QUU Coffee dijital menü — Türkçe, English, Русский" />
  <title>QUU Coffee Menü</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ================= SPLASH ================= -->
  <section id="splash" class="screen active" aria-label="QUU Coffee">
    <video id="bgVideo" class="splash-video" src="video/0926.mp4" autoplay muted loop playsinline preload="auto"></video>
    <div class="splash-shade"></div>

    <header class="splash-top">
      <button id="soundBtn" class="icon-btn lg-btn lg-dark" aria-label="Ses"><span class="lg-glass"></span><span class="lg-shadow"></span><span class="lg-content" id="soundIco" data-ico="volx"></span></button>
      <div class="lang-switch lg-surface lg-dark" role="group" aria-label="Dil / Language / Язык"></div>
    </header>

    <div class="splash-center">
      <div class="brand">
        <svg class="brand-leaf" viewBox="0 0 64 24" aria-hidden="true"><path d="M32 22c-6-2-10-7-10-14 6 1 10 6 10 14Zm0 0c6-2 10-7 10-14-6 1-10 6-10 14Z" fill="currentColor"/><path d="M2 14h18M44 14h18" stroke="currentColor" stroke-width="1.2"/></svg>
        <h1 class="brand-name">QUU</h1>
        <p class="brand-sub">C O F F E E</p>
      </div>
      <p class="tagline" data-i18n="tagline"></p>
    </div>

    <div class="splash-bottom">
      <a href="#/menu" class="cta lg-btn lg-dark" id="ctaMenu">
        <span class="lg-glass"></span><span class="lg-shadow"></span>
        <span class="lg-content cta-inner"><span data-i18n="viewMenu"></span><span class="cta-arrow" data-ico="arrowR"></span></span>
      </a>
      <nav class="quick" aria-label="Links">
        <a class="quick-btn lg-btn lg-dark" id="qWa" target="_blank" rel="noopener"><span class="lg-glass"></span><span class="lg-shadow"></span><span class="lg-content quick-inner"><span class="qi wa" data-ico="wa"></span><span data-i18n="whatsapp"></span></span></a>
        <a class="quick-btn lg-btn lg-dark" id="qGo" target="_blank" rel="noopener"><span class="lg-glass"></span><span class="lg-shadow"></span><span class="lg-content quick-inner"><span class="qi go" data-ico="starF"></span><span data-i18n="review"></span></span></a>
        <a class="quick-btn lg-btn lg-dark" id="qIg" target="_blank" rel="noopener"><span class="lg-glass"></span><span class="lg-shadow"></span><span class="lg-content quick-inner"><span class="qi ig" data-ico="ig"></span><span>Instagram</span></span></a>
        <button class="quick-btn lg-btn lg-dark" id="qWifi" type="button"><span class="lg-glass"></span><span class="lg-shadow"></span><span class="lg-content quick-inner"><span class="qi wf" data-ico="wifi"></span><span>Wi-Fi</span></span></button>
      </nav>
      <p class="vat" data-i18n="vat"></p>
    </div>
  </section>

  <!-- ================= CATEGORIES ================= -->
  <section id="menu" class="screen" aria-label="Menu">
    <header class="bar">
      <a href="#/" class="icon-btn lg-btn" aria-label="Home"><span class="lg-glass"></span><span class="lg-shadow"></span><span class="lg-content" data-ico="home"></span></a>
      <div class="bar-title"><span class="mini-brand">QUU</span><span class="mini-sub">COFFEE</span></div>
      <div class="lang-switch lg-surface compact" role="group"></div>
    </header>
    <div class="search-wrap">
      <label class="search">
        <span data-ico="search"></span>
        <input type="search" id="searchMenu" autocomplete="off" data-i18n-ph="searchPh" />
        <button class="search-clear" type="button" data-ico="x" aria-label="Clear" hidden></button>
      </label>
    </div>
    <main class="scroll" id="menuScroll">
      <h2 class="section-h" data-i18n="categories"></h2>
      <div class="cat-grid" id="catGrid"></div>
      <div class="results" id="menuResults" hidden></div>
      <p class="foot-note" data-i18n="disclaimer"></p>
    </main>
  </section>

  <!-- ================= CATEGORY ================= -->
  <section id="category" class="screen" aria-label="Category">
    <header class="bar">
      <a href="#/menu" class="icon-btn lg-btn" aria-label="Back"><span class="lg-glass"></span><span class="lg-shadow"></span><span class="lg-content" data-ico="back"></span></a>
      <div class="bar-title"><span class="mini-brand">QUU</span><span class="mini-sub">COFFEE</span></div>
      <div class="lang-switch lg-surface compact" role="group"></div>
    </header>
    <div class="search-wrap">
      <label class="search">
        <span data-ico="search"></span>
        <input type="search" id="searchCat" autocomplete="off" data-i18n-ph="searchPh" />
        <button class="search-clear" type="button" data-ico="x" aria-label="Clear" hidden></button>
      </label>
    </div>
    <nav class="chips" id="chips" aria-label="Categories"></nav>
    <main class="scroll" id="catScroll">
      <div id="catBody"></div>
      <div class="results" id="catResults" hidden></div>
      <div class="legend" id="legend"></div>
      <p class="foot-note" data-i18n="disclaimer"></p>
    </main>
  </section>

  <!-- ================= BOTTOM SHEET ================= -->
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <button class="icon-btn lg-btn sheet-close" id="sheetClose" aria-label="Close"><span class="lg-glass"></span><span class="lg-shadow"></span><span class="lg-content" data-ico="x"></span></button>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <!-- Liquid Glass SVG filtresi (LiquidButton > GlassFilter) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="container-glass" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.05 0.05" numOctaves="1" seed="1" result="turbulence" />
        <feGaussianBlur in="turbulence" stdDeviation="2" result="blurredNoise" />
        <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="70" xChannelSelector="R" yChannelSelector="B" result="displaced" />
        <feGaussianBlur in="displaced" stdDeviation="4" result="finalBlur" />
        <feComposite in="finalBlur" in2="finalBlur" operator="over" />
      </filter>
    </defs>
  </svg>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
